# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
# vim: set ts=2 sw=2 tw=0 fo=cnqoj

version: 2

before:
  hooks:
    # Generate web assets before building Go binaries
    - cd web && npm run build

builds:
  - id: console
    binary: console
    main: ./cmd/console
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    mod_timestamp: '{{ .CommitTimestamp }}'
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w
      - -X main.version={{ .Version }}
      - -X main.commit={{ .Commit }}
      - -X main.date={{ .CommitDate }}
    hooks:
      post:
        - cmd: sh -c 'test -f "{{ .Path }}" && echo "Binary built: {{ .Path }}" || (echo "Build failed: {{ .Path }} not found" && exit 1)'

  - id: kc-agent
    binary: kc-agent
    main: ./cmd/kc-agent
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    mod_timestamp: '{{ .CommitTimestamp }}'
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w
      - -X main.version={{ .Version }}
      - -X main.commit={{ .Commit }}
      - -X main.date={{ .CommitDate }}

archives:
  - id: kc-agent
    ids:
      - kc-agent
    name_template: >-
      kc-agent_{{ .Version }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}
      {{- if .Arm }}v{{ .Arm }}{{ end }}
    formats:
      - tar.gz

  - id: console
    ids:
      - console
    name_template: >-
      console_{{ .Version }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}
      {{- if .Arm }}v{{ .Arm }}{{ end }}
    formats:
      - tar.gz
    files:
      - src: web/dist/**
        dst: web/dist

checksum:
  name_template: 'checksums.txt'

brews:
  - name: kc-agent
    # Skip if token is not set
    skip_upload: '{{ if .Env.HOMEBREW_TAP_TOKEN }}false{{ else }}true{{ end }}'
    ids:
      - kc-agent
    repository:
      owner: kubestellar
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    directory: Formula
    homepage: "https://github.com/kubestellar/console"
    description: "Local agent for KubeStellar Console: browser to kubeconfig"
    license: "Apache-2.0"
    test: |
      system bin/"kc-agent", "--version"
    install: |
      bin.install "kc-agent"

release:
  github:
    owner: kubestellar
    name: console
  # Use RELEASE_NAME env var if set, otherwise fall back to tag
  name_template: "{{ if .Env.RELEASE_NAME }}{{ .Env.RELEASE_NAME }}{{ else }}{{ .Tag }}{{ end }}"
  draft: false
  prerelease: auto
