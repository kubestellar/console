{{- if and .Values.persistence.enabled .Values.backup.enabled }}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "kubestellar-console.fullname" . }}-db-backup
  labels:
    {{- include "kubestellar-console.labels" . | nindent 4 }}
spec:
  schedule: {{ .Values.backup.schedule | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: {{ .Values.backup.successfulJobsHistoryLimit }}
  failedJobsHistoryLimit: {{ .Values.backup.failedJobsHistoryLimit }}
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            app.kubernetes.io/name: {{ include "kubestellar-console.name" . }}
            app.kubernetes.io/instance: {{ .Release.Name }}
            app.kubernetes.io/component: db-backup
            {{- with .Values.podLabels }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
        spec:
          restartPolicy: OnFailure
          serviceAccountName: {{ include "kubestellar-console.serviceAccountName" . }}
          securityContext:
            {{- toYaml .Values.podSecurityContext | nindent 12 }}
          {{- with .Values.imagePullSecrets }}
          imagePullSecrets:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          containers:
            - name: db-backup
              image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
              # #6334: PodSecurity "restricted" requires the same
              # container-level securityContext as the main deployment.
              securityContext:
                {{- toYaml .Values.securityContext | nindent 16 }}
              resources:
                {{- toYaml .Values.backup.resources | nindent 16 }}
              command:
                - /bin/sh
                - -c
                - |
                  set -e
                  TIMESTAMP=$(date +%Y%m%d-%H%M%S)
                  DB_PATH="{{ .Values.database.sqlitePath }}"
                  BACKUP_DIR="{{ .Values.backup.directory }}"
                  RETENTION={{ .Values.backup.retentionCount }}

                  mkdir -p "$BACKUP_DIR"

                  is_valid_sqlite() {
                    [ -f "$1" ] || return 1
                    sqlite3 "$1" "PRAGMA quick_check;" 2>/dev/null | grep -qx "ok"
                  }

                  # Use SQLite .backup for a consistent, WAL-safe snapshot
                  if [ -f "$DB_PATH" ]; then
                    if ! is_valid_sqlite "$DB_PATH"; then
                      echo "ERROR: Database file failed SQLite integrity check at $DB_PATH"
                      exit 1
                    fi
                    sqlite3 "$DB_PATH" ".backup '$BACKUP_DIR/console-$TIMESTAMP.db'"
                    if ! is_valid_sqlite "$BACKUP_DIR/console-$TIMESTAMP.db"; then
                      echo "ERROR: Generated backup failed SQLite integrity check"
                      rm -f "$BACKUP_DIR/console-$TIMESTAMP.db"
                      exit 1
                    fi
                    echo "Backup created: $BACKUP_DIR/console-$TIMESTAMP.db"
                  else
                    echo "ERROR: Database file not found at $DB_PATH"
                    exit 1
                  fi

                  # Prune old backups, keep only the most recent $RETENTION
                  cd "$BACKUP_DIR"
                  BACKUP_COUNT=$(ls -1 console-*.db 2>/dev/null | wc -l)
                  if [ "$BACKUP_COUNT" -gt "$RETENTION" ]; then
                    PRUNE_COUNT=$((BACKUP_COUNT - RETENTION))
                    ls -1t console-*.db | tail -n "$PRUNE_COUNT" | xargs rm -f
                    echo "Pruned $PRUNE_COUNT old backup(s), kept $RETENTION"
                  fi
              volumeMounts:
                - name: data
                  mountPath: /app/data
                - name: backups
                  mountPath: {{ .Values.backup.directory }}
          volumes:
            - name: data
              persistentVolumeClaim:
                claimName: {{ include "kubestellar-console.fullname" . }}
            - name: backups
              persistentVolumeClaim:
                claimName: {{ include "kubestellar-console.fullname" . }}-backups
          {{- with .Values.nodeSelector }}
          nodeSelector:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.tolerations }}
          tolerations:
            {{- toYaml . | nindent 12 }}
          {{- end }}
{{- $existingBackupPVC := lookup "v1" "PersistentVolumeClaim" .Release.Namespace (printf "%s-backups" (include "kubestellar-console.fullname" .)) -}}
{{- if not $existingBackupPVC }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "kubestellar-console.fullname" . }}-backups
  labels:
    {{- include "kubestellar-console.labels" . | nindent 4 }}
  annotations:
    "helm.sh/resource-policy": keep
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: {{ .Values.backup.storageSize }}
  {{- $storageClassName := include "kubestellar-console.storageClassName" (dict "accessModes" (list "ReadWriteMany") "storageClass" (coalesce .Values.backup.storageClass .Values.persistence.storageClass)) -}}
  {{- if $storageClassName }}
  storageClassName: {{ $storageClassName | quote }}
  {{- end }}
{{- end }}
{{- end }}
