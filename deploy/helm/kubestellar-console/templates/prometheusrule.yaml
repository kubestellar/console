{{- if .Values.metrics.prometheusRule.enabled }}
{{- /*
PrometheusRule for the Prometheus Operator (https://prometheus-operator.dev/).
Disabled by default (opt-in) — this only defines alerting rules evaluated by
an operator-controlled Prometheus against the console's own bounded
self-metrics (see pkg/api/metrics); it does not send any data anywhere.
Enable it only when the cluster already runs Prometheus Operator with the
PrometheusRule CRD installed, and metrics.serviceMonitor.enabled is also true
so the metrics these rules reference are actually being scraped.
*/}}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ include "kubestellar-console.fullname" . }}
  labels:
    {{- include "kubestellar-console.labels" . | nindent 4 }}
    {{- with .Values.metrics.prometheusRule.additionalLabels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  groups:
    - name: {{ include "kubestellar-console.fullname" . }}.rules
      rules:
        - alert: ConsoleHighErrorRate
          expr: >-
            sum(rate(console_http_requests_total{status=~"5.."}[5m]))
            /
            sum(rate(console_http_requests_total[5m]))
            > {{ .Values.metrics.prometheusRule.errorRateThreshold }}
          for: {{ .Values.metrics.prometheusRule.errorRateFor }}
          labels:
            severity: {{ .Values.metrics.prometheusRule.errorRateSeverity }}
          annotations:
            summary: "Console backend 5xx rate is above threshold"
            description: >-
              More than {{ "{{" }} $value | humanizePercentage {{ "}}" }} of requests to the
              console backend have returned a 5xx status over the last 5 minutes.
        - alert: ConsoleHighRequestLatency
          expr: >-
            histogram_quantile(0.95,
              sum(rate(console_http_request_duration_seconds_bucket[5m])) by (le)
            ) > {{ .Values.metrics.prometheusRule.p95LatencySeconds }}
          for: {{ .Values.metrics.prometheusRule.p95LatencyFor }}
          labels:
            severity: {{ .Values.metrics.prometheusRule.p95LatencySeverity }}
          annotations:
            summary: "Console backend p95 request latency is elevated"
            description: >-
              The 95th percentile request latency for the console backend has
              exceeded {{ .Values.metrics.prometheusRule.p95LatencySeconds }}s
              over the last 5 minutes (current value: {{ "{{" }} $value | humanizeDuration {{ "}}" }}).
        - alert: ConsoleStellarSchedulerStalled
          expr: >-
            increase(console_stellar_scheduler_dispatch_cycles_total[{{ .Values.metrics.prometheusRule.schedulerStallFor }}]) == 0
          for: {{ .Values.metrics.prometheusRule.schedulerStallFor }}
          labels:
            severity: {{ .Values.metrics.prometheusRule.schedulerStallSeverity }}
          annotations:
            summary: "Stellar action scheduler has stopped dispatching"
            description: >-
              console_stellar_scheduler_dispatch_cycles_total has not
              increased in the last {{ .Values.metrics.prometheusRule.schedulerStallFor }},
              meaning the 30s poll loop that dispatches due Stellar actions
              (pkg/stellar/scheduler) appears to have stopped running.
        - alert: ConsoleNotificationDeliveryFailing
          expr: >-
            sum(rate(console_notification_sends_total{outcome="failed"}[15m]))
            /
            sum(rate(console_notification_sends_total[15m]))
            > {{ .Values.metrics.prometheusRule.notificationFailureRateThreshold }}
          for: {{ .Values.metrics.prometheusRule.notificationFailureRateFor }}
          labels:
            severity: {{ .Values.metrics.prometheusRule.notificationFailureRateSeverity }}
          annotations:
            summary: "Console alert-notification delivery is failing"
            description: >-
              More than {{ "{{" }} $value | humanizePercentage {{ "}}" }} of
              alert-notification delivery attempts (Slack/Email/PagerDuty/
              OpsGenie/webhook) have failed over the last 15 minutes,
              meaning users may not be receiving Stellar alerts.
        - alert: ConsoleGPUUtilDCGMScrapeErrors
          expr: >-
            increase(console_gpu_util_dcgm_scrape_errors_total[15m]) > 0
          for: {{ .Values.metrics.prometheusRule.gpuDcgmErrorFor }}
          labels:
            severity: {{ .Values.metrics.prometheusRule.gpuDcgmErrorSeverity }}
          annotations:
            summary: "GPU utilization worker's DCGM exporter scrapes are failing"
            description: >-
              The GPU utilization worker (opt-in feature) has recorded
              console_gpu_util_dcgm_scrape_errors_total increases over the
              last {{ .Values.metrics.prometheusRule.gpuDcgmErrorFor }},
              meaning DCGM exporter scrapes are failing and GPU utilization
              data may be stale or missing.
{{- end }}
