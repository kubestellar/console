{{- if .Values.persistence.enabled }}
{{- $targetAccessMode := "ReadWriteMany" -}}
{{- if .Values.persistence.accessModes -}}
{{- $targetAccessMode = index .Values.persistence.accessModes 0 -}}
{{- end -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "kubestellar-console.fullname" . }}-pvc-migration
  labels:
    {{- include "kubestellar-console.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-upgrade
    "helm.sh/hook-weight": "-10"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded,hook-failed
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "kubestellar-console.fullname" . }}-pvc-migration
  labels:
    {{- include "kubestellar-console.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-upgrade
    "helm.sh/hook-weight": "-10"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded,hook-failed
rules:
  - apiGroups: [""]
    resources: ["persistentvolumeclaims"]
    verbs: ["get", "list", "watch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "kubestellar-console.fullname" . }}-pvc-migration
  labels:
    {{- include "kubestellar-console.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-upgrade
    "helm.sh/hook-weight": "-10"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded,hook-failed
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "kubestellar-console.fullname" . }}-pvc-migration
subjects:
  - kind: ServiceAccount
    name: {{ include "kubestellar-console.fullname" . }}-pvc-migration
    namespace: {{ .Release.Namespace }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "kubestellar-console.fullname" . }}-pvc-migration
  labels:
    {{- include "kubestellar-console.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-upgrade
    "helm.sh/hook-weight": "0"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded,hook-failed
spec:
  backoffLimit: 3
  # Deadline is intentionally well inside Helm's --timeout (10m/600s, see
  # deploy_helm in .github/workflows/build-deploy.yml). Each PVC delete
  # gets a 180s timeout (see --timeout=180s below); 360s covers two PVCs plus
  # retries/status checks with margin. Keeping this shorter than Helm's
  # timeout is deliberate: it lets the Job hit its own deadline and fail
  # with clear logs, instead of racing Helm's clock and surfacing only as
  # "pre-upgrade hooks failed ... context deadline exceeded" with no
  # actionable signal (the intermittent failure this fixes).
  activeDeadlineSeconds: 360
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "kubestellar-console.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: pvc-migration
    spec:
      restartPolicy: Never
      serviceAccountName: {{ include "kubestellar-console.fullname" . }}-pvc-migration
      securityContext:
        # The migration Job doesn't mount any PVCs itself, so fsGroup is not
        # needed and must be omitted: on OpenShift the restricted-v2 SCC
        # rejects an explicit fsGroup that falls outside its allowed range,
        # which is exactly what broke the deploy-pok-prod job after fsGroup:
        # 1001 was added to .Values.podSecurityContext (see #20590/#20620).
        # We still set seccompProfile because restricted enforcement requires it.
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migrate-pvcs
          image: "{{ .Values.migration.image.repository }}:{{ .Values.migration.image.tag }}"
          imagePullPolicy: IfNotPresent
          # Use a lighter securityContext for the migration job: the kubectl
          # image (alpine/k8s) runs as root (UID 0) and has no non-root
          # user baked in. Setting runAsNonRoot: true causes Kubernetes to
          # refuse to start the container (Error: container has runAsNonRoot
          # and image will run as root), which breaks the pre-upgrade hook
          # and causes helm to fail with "pre-upgrade hooks failed" (#22919).
          # We explicitly set runAsNonRoot: false + runAsUser: 0 to match
          # the image's actual runtime UID and allow the hook to run.
          securityContext:
            runAsNonRoot: false
            runAsUser: 0
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          env:
            # HOME is set to /tmp (world-writable) so kubectl cache/config
            # writes succeed even though the container runs as root inside a
            # restricted namespace (some environments mount /root read-only).
            - name: HOME
              value: /tmp
          command:
            # alpine/k8s ships /bin/sh (busybox ash), not bash. The script
            # below is POSIX-sh compatible (no [[, <<<, arrays, or other
            # bashisms) so it runs unmodified under sh. `set -o pipefail`
            # is not POSIX; omitted since the script uses no pipelines
            # whose exit status matters.
            - /bin/sh
            - -c
            - |
              set -eu

              NAMESPACE="{{ .Release.Namespace }}"
              MAIN_PVC="{{ include "kubestellar-console.fullname" . }}"
              BACKUP_PVC="{{ include "kubestellar-console.fullname" . }}-backups"
              TARGET_ACCESS_MODE="{{ $targetAccessMode }}"

              echo "=== PVC Access Mode Migration ==="
              echo "Namespace: $NAMESPACE"
              echo "Target access mode: $TARGET_ACCESS_MODE"
              echo ""

              migrate_pvc() {
                local pvc_name=$1
                echo "Checking PVC: $pvc_name"

                if ! kubectl get pvc "$pvc_name" -n "$NAMESPACE" >/dev/null 2>&1; then
                  echo "  PVC does not exist (new install). Skipping."
                  return 0
                fi

                local current_mode
                current_mode=$(kubectl get pvc "$pvc_name" -n "$NAMESPACE" -o jsonpath='{.spec.accessModes[0]}' 2>/dev/null || echo "")

                if [ -z "$current_mode" ]; then
                  echo "  WARNING: Could not read access mode. Skipping."
                  return 0
                fi

                echo "  Current access mode: $current_mode"

                if [ "$current_mode" = "$TARGET_ACCESS_MODE" ]; then
                  echo "  Access mode already correct. No migration needed."
                  return 0
                fi

                # Check if PVC is already being deleted
                local pvc_phase
                pvc_phase=$(kubectl get pvc "$pvc_name" -n "$NAMESPACE" -o jsonpath='{.status.phase}' 2>/dev/null || echo "")
                
                local deletion_timestamp
                deletion_timestamp=$(kubectl get pvc "$pvc_name" -n "$NAMESPACE" -o jsonpath='{.metadata.deletionTimestamp}' 2>/dev/null || echo "")

                echo "  PVC phase: ${pvc_phase:-unknown}"
                
                if [ -n "$deletion_timestamp" ]; then
                  echo "  PVC is already being deleted (deletionTimestamp: $deletion_timestamp)."
                  echo "  Skipping delete operation. Helm will recreate with correct access mode."
                  return 0
                fi

                echo "  Access mode mismatch detected!"
                echo "  Deleting PVC to allow recreation with $TARGET_ACCESS_MODE..."
                
                # Extended timeout from 120s to 180s to handle slow deletions
                if kubectl delete pvc "$pvc_name" -n "$NAMESPACE" --wait=true --timeout=180s; then
                  echo "  PVC deleted successfully."
                else
                  echo "  ERROR: Failed to delete PVC within timeout."
                  return 1
                fi
              }

              # Migrate main data PVC
              migrate_pvc "$MAIN_PVC"

              {{- if .Values.backup.enabled }}
              # Migrate backup PVC
              migrate_pvc "$BACKUP_PVC"
              {{- end }}

              echo ""
              echo "=== Migration Complete ==="
              echo "Helm will now create PVCs with $TARGET_ACCESS_MODE access mode."
{{- end }}
