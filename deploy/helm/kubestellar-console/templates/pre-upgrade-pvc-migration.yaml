{{- if .Values.persistence.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "kubestellar-console.fullname" . }}-pvc-migration
  labels:
    {{- include "kubestellar-console.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-upgrade
    "helm.sh/hook-weight": "-10"
    # hook-failed included so a failed hook cleans up its resources on the next
    # release; otherwise the failed Job pods (and their PVCs) can wedge the
    # namespace and block subsequent upgrades. See #20471.
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded,hook-failed
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "kubestellar-console.fullname" . }}-pvc-migration
  labels:
    {{- include "kubestellar-console.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-upgrade
    "helm.sh/hook-weight": "-10"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded,hook-failed
rules:
  - apiGroups: [""]
    resources: ["persistentvolumeclaims"]
    # `patch` is required so the migration script can clear stuck finalizers
    # when a PVC deletion hangs in Terminating (see #20471).
    verbs: ["get", "list", "delete", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "kubestellar-console.fullname" . }}-pvc-migration
  labels:
    {{- include "kubestellar-console.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-upgrade
    "helm.sh/hook-weight": "-10"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded,hook-failed
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "kubestellar-console.fullname" . }}-pvc-migration
subjects:
  - kind: ServiceAccount
    name: {{ include "kubestellar-console.fullname" . }}-pvc-migration
    namespace: {{ .Release.Namespace }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "kubestellar-console.fullname" . }}-pvc-migration
  labels:
    {{- include "kubestellar-console.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-upgrade
    "helm.sh/hook-weight": "0"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded,hook-failed
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "kubestellar-console.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: pvc-migration
    spec:
      restartPolicy: Never
      serviceAccountName: {{ include "kubestellar-console.fullname" . }}-pvc-migration
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: migrate-pvcs
          image: bitnami/kubectl:latest
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          command:
            - /bin/bash
            - -c
            - |
              set -euo pipefail

              NAMESPACE="{{ .Release.Namespace }}"
              MAIN_PVC="{{ include "kubestellar-console.fullname" . }}"
              BACKUP_PVC="{{ include "kubestellar-console.fullname" . }}-backups"
              TARGET_ACCESS_MODE="ReadWriteMany"

              echo "=== PVC Access Mode Migration ==="
              echo "Namespace: $NAMESPACE"
              echo "Target access mode: $TARGET_ACCESS_MODE"
              echo ""

              migrate_pvc() {
                local pvc_name=$1
                echo "Checking PVC: $pvc_name"

                if ! kubectl get pvc "$pvc_name" -n "$NAMESPACE" &>/dev/null; then
                  echo "  PVC does not exist (new install). Skipping."
                  return 0
                fi

                local current_mode
                current_mode=$(kubectl get pvc "$pvc_name" -n "$NAMESPACE" -o jsonpath='{.spec.accessModes[0]}' 2>/dev/null || echo "")

                if [ -z "$current_mode" ]; then
                  echo "  WARNING: Could not read access mode. Skipping."
                  return 0
                fi

                echo "  Current access mode: $current_mode"

                if [ "$current_mode" = "$TARGET_ACCESS_MODE" ]; then
                  echo "  Access mode already correct. No migration needed."
                  return 0
                fi

                echo "  Access mode mismatch detected!"
                echo "  Deleting PVC to allow recreation with $TARGET_ACCESS_MODE..."

                # Submit delete non-blocking, then wait separately so we can
                # fall back to finalizer removal if the PVC gets stuck in
                # Terminating (kubelet still holds a mount, PV driver hung,
                # etc.). Without this fallback a stuck PVC wedges the whole
                # Helm upgrade and blocks the release for manual cleanup —
                # exactly what happened in #20471.
                kubectl delete pvc "$pvc_name" -n "$NAMESPACE" --wait=false || true

                if kubectl wait --for=delete "pvc/$pvc_name" -n "$NAMESPACE" --timeout=120s 2>/dev/null; then
                  echo "  PVC deleted successfully."
                  return 0
                fi

                echo "  WARNING: PVC still Terminating after 120s. Removing finalizers to unblock..."
                kubectl patch pvc "$pvc_name" -n "$NAMESPACE" \
                  -p '{"metadata":{"finalizers":null}}' --type=merge 2>/dev/null || true

                if kubectl wait --for=delete "pvc/$pvc_name" -n "$NAMESPACE" --timeout=60s 2>/dev/null; then
                  echo "  PVC deleted after finalizer removal."
                  return 0
                fi

                echo "  ERROR: PVC '$pvc_name' remained stuck in Terminating after finalizer removal."
                return 1
              }

              # Migrate main data PVC
              migrate_pvc "$MAIN_PVC"

              {{- if .Values.backup.enabled }}
              # Migrate backup PVC
              migrate_pvc "$BACKUP_PVC"
              {{- end }}

              echo ""
              echo "=== Migration Complete ==="
              echo "Helm will now create PVCs with $TARGET_ACCESS_MODE access mode."
{{- end }}
