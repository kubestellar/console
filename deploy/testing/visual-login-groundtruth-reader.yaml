apiVersion: v1
kind: ServiceAccount
metadata:
  name: visual-login-groundtruth-reader
  namespace: default
  labels:
    app.kubernetes.io/name: kubestellar-console
    app.kubernetes.io/component: visual-login-groundtruth
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: visual-login-groundtruth-reader
  labels:
    app.kubernetes.io/name: kubestellar-console
    app.kubernetes.io/component: visual-login-groundtruth
rules:
  - apiGroups: [""]
    resources: ["nodes", "namespaces", "pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["events.k8s.io"]
    resources: ["events"]
    verbs: ["get", "list", "watch"]
  # /deployments live page also lists ReplicaSets, StatefulSets and DaemonSets
  # via /api/mcp/{replicasets,statefulsets,daemonsets}; without these the live
  # console returns 503 for every CI cluster (#24242, run 39601160527).
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets", "statefulsets", "daemonsets"]
    verbs: ["get", "list", "watch"]
  # /api/mcp/hpas (deployments page autoscaling widget) lists HPAs cluster-wide
  # (autoscaling/v2 with a v1 fallback); same 503 failure mode as above.
  - apiGroups: ["autoscaling"]
    resources: ["horizontalpodautoscalers"]
    verbs: ["get", "list", "watch"]
  # /api/mcp/pvcs (live canary storage widget) lists PVCs cluster-wide; without
  # this the live console returns 503 for every CI cluster (#24242, #24490).
  - apiGroups: [""]
    resources: ["persistentvolumeclaims"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: visual-login-groundtruth-reader
  labels:
    app.kubernetes.io/name: kubestellar-console
    app.kubernetes.io/component: visual-login-groundtruth
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: visual-login-groundtruth-reader
subjects:
  - kind: ServiceAccount
    name: visual-login-groundtruth-reader
    namespace: default
