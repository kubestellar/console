# Pre-broken deployment for the Stellar pitch demo.
#
# Apply once before recording:
#   1. kubectl create ns payments
#   2. kubectl apply -f demo/stellar/crashloop-deployment.yaml
#   3. (in another pane) kubectl get pods -n payments -w
#
# The container starts, sleeps 2 seconds, then exits non-zero. Kubernetes will
# back off and restart it, putting the pod into CrashLoopBackOff within ~30s.
#
# Beat 5 of the demo (clicking "Restart" in the sidebar) calls the existing
# scheduler dispatch (pkg/stellar/scheduler/dispatch.go RestartDeployment)
# which patches the pod template with kubectl.kubernetes.io/restartedAt,
# triggering a real rollout — visible in `kubectl get pods -w`.
---
apiVersion: v1
kind: Namespace
metadata:
  name: payments1
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-server
  namespace: payments
  labels:
    app: api-server
    demo: stellar
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-server
  template:
    metadata:
      labels:
        app: api-server
    spec:
      containers:
        - name: app
          image: busybox:1.36
          command: ["sh", "-c", "echo starting; sleep 2; exit 1"]
          resources:
            requests:
              cpu: "10m"
              memory: "16Mi"
            limits:
              cpu: "50m"
              memory: "32Mi"
