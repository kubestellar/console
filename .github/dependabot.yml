updates:
- commit-message:
    prefix: chore(deps)
  directory: /
  labels:
  - dependencies
  - go
  open-pull-requests-limit: 10
  package-ecosystem: gomod
  reviewers:
  - clubanderson
  schedule:
    day: monday
    interval: weekly
- commit-message:
    prefix: chore(deps)
  directory: /web
  ignore:
  - dependency-name: "@playwright/test" # Pinned to 1.61.1 — later releases regress macOS WebKit (PushAPIEnabled protocol error, see #22334/#23548). Do not bump until upstream ships a fix.
  - dependency-name: "playwright" # Transitive of @playwright/test; keep in lockstep with the pinned version above.
  - dependency-name: "playwright-core" # Transitive of @playwright/test; keep in lockstep with the pinned version above.
  labels:
  - dependencies
  - javascript
  open-pull-requests-limit: 10
  package-ecosystem: npm
  reviewers:
  - clubanderson
  schedule:
    day: monday
    interval: weekly
- commit-message:
    prefix: chore(deps)
  directory: /
  groups:
    codeql-action:
      patterns:
      - github/codeql-action/*
  ignore:
  - dependency-name: "github/gh-aw-actions/**"
  - dependency-name: "github/gh-aw-actions" # Managed by gh aw compile. Version-locked to the gh-aw compiler; do not bump.
  labels:
  - dependencies
  - github-actions
  open-pull-requests-limit: 5
  package-ecosystem: github-actions
  reviewers:
  - clubanderson
  schedule:
    day: monday
    interval: weekly
- commit-message:
    prefix: chore(deps)
  directory: /
  labels:
  - dependencies
  - docker
  open-pull-requests-limit: 5
  package-ecosystem: docker
  reviewers:
  - clubanderson
  schedule:
    day: monday
    interval: weekly
- commit-message:
    prefix: chore(deps)
  directory: /cmd/kc-agent
  labels:
  - dependencies
  - docker
  open-pull-requests-limit: 5
  package-ecosystem: docker
  reviewers:
  - clubanderson
  schedule:
    day: monday
    interval: weekly
- commit-message:
    prefix: chore(deps)
  directory: /.github
  labels:
  - dependencies
  - python
  open-pull-requests-limit: 5
  package-ecosystem: pip
  reviewers:
  - clubanderson
  schedule:
    day: monday
    interval: weekly
version: 2
