name: Route & Modal Smoke Test

on:
  schedule:
    # Run hourly to catch regressions early
    - cron: '0 * * * *'
  pull_request:
    paths:
      - 'web/src/components/**'
      - 'web/src/pages/**'
      - 'web/src/App.tsx'
      - 'web/src/config/routes.ts'
      - 'web/src/lib/modals/**'
      - 'web/src/test/route-smoke.test.ts'
  workflow_dispatch:

# Least-privilege: read-only by default
permissions: read-all

jobs:
  route-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - run: npm ci

      - name: Run route & modal smoke tests
        run: npx vitest run src/test/route-smoke.test.ts
