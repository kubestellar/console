name: UI/UX Standards

on:
  schedule:
    # Run nightly at 03:00 UTC (alongside card-standard-nightly)
    - cron: '0 3 * * *'
  pull_request:
    paths:
      - 'web/src/components/**'
      - 'web/src/test/ui-ux-standards.test.ts'
      - 'web/package.json'
      - 'web/package-lock.json'
  workflow_dispatch:

# Least-privilege: read-only by default; jobs declare write scopes individually
permissions: read-all

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ui-ux-standard:
    if: github.repository == 'kubestellar/console'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - run: npm ci

      - name: Run UI/UX standards tests
        run: npx vitest run src/test/ui-ux-standards.test.ts
