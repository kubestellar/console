name: Visual Regression

on:
  pull_request:
    paths:
      - 'web/src/components/ui/**'
      - 'web/src/index.css'
      - 'web/src/lib/themes.ts'
      - 'web/.storybook/**'
      - 'web/src/**/*.stories.tsx'
      - 'web/e2e/visual/**'
  workflow_dispatch:

jobs:
  visual-regression:
    if: github.repository == 'kubestellar/console'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Build Storybook
        run: npm run build-storybook

      - name: Run visual regression tests
        run: npx playwright test --config e2e/visual/visual.config.ts

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-regression-report
          path: web/visual-report/
          retention-days: 14

      - name: Upload updated snapshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-regression-snapshots
          path: web/e2e/visual/**/*-snapshots/
          retention-days: 14
