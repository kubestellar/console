name: Update deploy.sh checksum

on:
  push:
    branches: [main]
    paths: [deploy.sh]

permissions: read-all

jobs:
  update-checksum:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    # contents: write required to commit updated checksum to repository
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Generate SHA-256 checksum
        run: sha256sum deploy.sh > deploy.sh.sha256

      - name: Commit updated checksum
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add deploy.sh.sha256
          if git diff --cached --quiet; then
            echo "No changes to checksum"
          else
            git commit -s -m "🌱 Update deploy.sh.sha256"
            git push
          fi
