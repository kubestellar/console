name: Update deploy.sh checksum

on:
  push:
    branches: [main]
    paths: [deploy.sh]

permissions:
  contents: read

jobs:
  update-checksum:
    permissions:
      # contents: write required to commit the updated deploy.sh.sha256 checksum file
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Generate SHA-256 checksum
        run: sha256sum deploy.sh > deploy.sh.sha256

      - name: Commit updated checksum
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add deploy.sh.sha256
          if git diff --cached --quiet; then
            echo "No changes to checksum"
          else
            git commit -s -m "🌱 Update deploy.sh.sha256"
            git push
          fi
