name: Greetings

on:
  pull_request_target:
    types: [opened, reopened]
  issues:
    types: [opened, reopened]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  greet:
    # Skip bot users — greeting actions fail (non-zero exit) for bot accounts.
    # Fork guard prevents running on external fork PRs.
    if: >
      github.actor_type != 'Bot' &&
      (github.event_name != 'pull_request_target' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    uses: kubestellar/infra/.github/workflows/reusable-greetings.yml@a160acca0bdce1ac6c649e006d680d5f6d53024e  # pinned SHA (was @main)
    secrets: inherit
