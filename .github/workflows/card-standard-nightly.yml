name: Card Loading Standard

on:
  schedule:
    # Run nightly at 03:00 UTC
    - cron: '0 3 * * *'
  pull_request:
    paths:
      - 'web/src/components/cards/**'
      - 'web/src/test/card-loading-standard.test.ts'
      - 'web/package.json'
      - 'web/package-lock.json'
  workflow_dispatch:

# Least-privilege: read-only by default; jobs declare write scopes individually
permissions: read-all

jobs:
  card-standard:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - run: npm ci

      - name: Run card loading standard tests
        run: npx vitest run src/test/card-loading-standard.test.ts
