name: OpenSSF Scorecard

on:
  schedule:
    - cron: '0 6 * * 1'
  push:
    branches: [ "main" ]
  workflow_dispatch:

# Least-privilege at the top level; the scan job requests the write scopes
# scorecard actually needs (SARIF upload, OIDC signing) narrowly. Anything
# else stays read-only for TokenPermissions compliance.
permissions:
  contents: read

jobs:
  analysis:
    permissions:
      security-events: write
      contents: read
      actions: read
      id-token: write
    uses: kubestellar/infra/.github/workflows/reusable-scorecard.yml@main
    secrets: inherit
