name: Perf — React Commit Budget

# Guard against React commit cascades like #6149. Runs against the dev
# server (PERF_DEV=1) because React only fires the DevTools
# `onCommitFiberRoot` hook in non-production builds. Runs every 2 hours so
# that when a regression lands, the bisect window is narrow (~2h of merges
# instead of ~24h).

on:
  schedule:
    # Every 2 hours at :15 — offset from the top of the hour to avoid
    # contention with other scheduled workflows on the runner pool.
    - cron: '15 */2 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  actions: read

# Cancel any in-progress run when a new one is scheduled so a slow run
# can't pile up behind the next tick.
concurrency:
  group: perf-react-commits
  cancel-in-progress: true

env:
  CI: true

jobs:
  perf-react-commits:
    name: React Commit Budget
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: web

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Need history so the report-failure job can list merges between
          # the current commit and the last successful run.
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run React commit budget test
        run: npm run test:e2e:perf:commits

      - name: Upload perf result JSON
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: perf-result
          path: web/perf-result.json
          if-no-files-found: warn
          # 14 days is enough for the report-failure job and for a human to
          # inspect after the fact.
          retention-days: 14

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: react-commits-report
          path: |
            web/perf-report/
            web/e2e/test-results/
          retention-days: 14

  report-failure:
    name: Report Regression
    needs: [perf-react-commits]
    if: failure()
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      actions: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download perf result
        uses: actions/download-artifact@v4
        with:
          name: perf-result
          path: .
        continue-on-error: true

      - name: Find or file regression issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ format('https://github.com/{0}/actions/runs/{1}', github.repository, github.run_id) }}
        run: |
          set -euo pipefail

          # Parse the perf-result.json if the test wrote one. Fall back to
          # "unknown" so the issue body is still useful when the counter
          # never initialized.
          if [ -f perf-result.json ]; then
            COMMITS=$(jq -r '.commits // "unknown"' perf-result.json)
            BUDGET=$(jq -r '.budget // "unknown"' perf-result.json)
            NAV=$(jq -r '.navigatedTo // "unknown"' perf-result.json)
          else
            COMMITS="unknown"
            BUDGET="unknown"
            NAV="unknown"
          fi

          SHA="${GITHUB_SHA}"
          SHORT_SHA="${SHA:0:7}"
          SHORT_MSG=$(git log -1 --pretty=format:'%s' "$SHA" || echo "unknown")

          # Find the most recent successful run of THIS workflow to compute
          # the bisect window. Fall back to HEAD~20 if there is no prior
          # success (e.g. first run).
          LAST_GOOD_SHA=$(gh run list \
            --repo "$GITHUB_REPOSITORY" \
            --workflow perf-react-commits.yml \
            --status success \
            --limit 1 \
            --json headSha \
            --jq '.[0].headSha' || true)
          if [ -z "$LAST_GOOD_SHA" ] || [ "$LAST_GOOD_SHA" = "null" ]; then
            # No prior success — show the last 20 merges as context.
            MERGES=$(git log -20 --merges --pretty=format:'- %h %s' || echo "- (no history)")
          else
            MERGES=$(git log --merges --pretty=format:'- %h %s' "$LAST_GOOD_SHA..$SHA" || echo "- (git log failed)")
            if [ -z "$MERGES" ]; then
              MERGES="- (no merges since last success $LAST_GOOD_SHA)"
            fi
          fi

          ISSUE_TITLE="[perf-regression] dashboard navigation commits over budget"

          BODY=$(cat <<EOF
          The React commit budget test went over budget on the scheduled
          every-2h run.

          - **Commits observed:** \`$COMMITS\`
          - **Budget:** \`$BUDGET\`
          - **Navigated to:** \`$NAV\`
          - **Failing run:** $RUN_URL
          - **HEAD commit:** \`$SHORT_SHA\` — $SHORT_MSG

          ### Merges in the bisect window
          $MERGES

          ---
          _Auto-filed by the \`Perf — React Commit Budget\` workflow. This
          issue is deduped by title — subsequent failures will comment here
          instead of opening new issues._
          EOF
          )

          EXISTING=$(gh issue list \
            --repo "$GITHUB_REPOSITORY" \
            --state open \
            --search '[perf-regression] dashboard navigation commits in:title' \
            --json number \
            --jq '.[0].number' || true)

          if [ -n "$EXISTING" ] && [ "$EXISTING" != "null" ]; then
            echo "Found existing issue #$EXISTING — commenting"
            gh issue comment "$EXISTING" \
              --repo "$GITHUB_REPOSITORY" \
              --body "$BODY"
          else
            echo "No existing issue — creating new one"
            gh issue create \
              --repo "$GITHUB_REPOSITORY" \
              --title "$ISSUE_TITLE" \
              --body "$BODY" \
              --label "kind/bug,priority/high,triage/accepted"
          fi
